name: "CI - Validacion"

on:
  pull_request:
    branches: [dev, qa, main]

jobs:
  ci:
    name: "Lint + Tests + Sintaxis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint con flake8
        run: |
          # Solo advertir sobre errores severos y formateo estándar
          flake8 src/ --max-line-length=120 --exclude=venv,.venv

      - name: Validar sintaxis de archivos clave
        run: |
          python -m py_compile src/ea1.py
          python -m py_compile src/scrapper.py
          python -m py_compile src/modelo.py
          python -m py_compile src/ejecucion.py
          python -m py_compile src/pipeline.py
          python -m py_compile src/dashboard.py

      - name: Pruebas unitarias
        run: |
          pytest tests/ -v

      - name: Ejecución de prueba del pipeline
        run: |
          python src/pipeline.py
          python src/dashboard.py
          echo "Pipeline y Dashboard generados correctamente en CI"
